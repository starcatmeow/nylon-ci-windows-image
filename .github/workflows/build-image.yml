name: Build and publish Windows CI image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nylon-ci-windows-image-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free space for the ISOs and disk image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h "$GITHUB_WORKSPACE"
          available_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if (( available_bytes < 40 * 1024 * 1024 * 1024 )); then
            echo '::error::At least 40 GiB of free disk space is required.'
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          enable_kvm: true
          extra_nix_config: |
            extra-system-features = kvm

      - name: Allow Nix builders to use KVM
        run: |
          test -c /dev/kvm
          if ! command -v setfacl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends acl
          fi
          sudo setfacl -m g:nixbld:rw /dev/kvm
          sudo -u nixbld1 test -r /dev/kvm
          sudo -u nixbld1 test -w /dev/kvm

      - name: Build the compressed qcow2 image
        run: nix build .#nylon-ci-win2025 --out-link result-ci --print-build-logs

      - name: Read R2 credentials from Vault using GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.starcatmeow.cn
          role: nylon-ci-windows-image
          method: jwt
          path: gha
          exportEnv: false
          secrets: |
            secret/data/nylon/windows-ci-image-r2 AWS_ACCESS_KEY_ID | AWS_ACCESS_KEY_ID ;
            secret/data/nylon/windows-ci-image-r2 AWS_SECRET_ACCESS_KEY | AWS_SECRET_ACCESS_KEY ;
            secret/data/nylon/windows-ci-image-r2 AWS_ENDPOINT_URL_S3 | AWS_ENDPOINT_URL_S3

      - name: Upload the image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.vault.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.vault.outputs.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ steps.vault.outputs.AWS_ENDPOINT_URL_S3 }}
          AWS_CONFIG_FILE: ${{ runner.temp }}/nylon-aws-config
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          nix shell --inputs-from . nixpkgs#awscli2 --command bash -euo pipefail <<'UPLOAD'
            aws configure set default.s3.preferred_transfer_client classic
            aws s3 cp \
              result-ci/nylon-ci-win2025.qcow2.zst \
              s3://nylon-ci-windows-image/nylon-ci-win2025.qcow2.zst \
              --endpoint-url "$AWS_ENDPOINT_URL_S3" \
              --region auto \
              --content-type application/zstd \
              --only-show-errors
          UPLOAD
