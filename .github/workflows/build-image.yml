name: Build and publish Windows CI image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nylon-ci-windows-image-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free space for the ISOs and disk image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h "$GITHUB_WORKSPACE"
          available_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if (( available_bytes < 40 * 1024 * 1024 * 1024 )); then
            echo '::error::At least 40 GiB of free disk space is required.'
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          enable_kvm: true
          extra_nix_config: |
            extra-system-features = kvm

      - name: Allow Nix builders to use KVM
        run: |
          test -c /dev/kvm
          if ! command -v setfacl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends acl
          fi
          sudo setfacl -m g:nixbld:rw /dev/kvm
          sudo -u nixbld1 test -r /dev/kvm
          sudo -u nixbld1 test -w /dev/kvm

      - name: Build the compressed qcow2 image
        run: nix build .#nylon-ci-win2025 --out-link result-ci --print-build-logs

      - name: Read R2 credentials and cache signing key from Vault using GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.starcatmeow.cn
          role: nylon-ci-windows-image
          method: jwt
          path: gha
          exportEnv: false
          secrets: |
            secret/data/nylon/windows-ci-image-r2 AWS_ACCESS_KEY_ID | AWS_ACCESS_KEY_ID ;
            secret/data/nylon/windows-ci-image-r2 AWS_SECRET_ACCESS_KEY | AWS_SECRET_ACCESS_KEY ;
            secret/data/nylon/windows-ci-image-r2 AWS_ENDPOINT_URL_S3 | AWS_ENDPOINT_URL_S3 ;
            secret/data/nylon/nix-cache key | NIX_CACHE_SIGNING_KEY

      - name: Publish the final image package to the R2 Nix cache
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.vault.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.vault.outputs.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ steps.vault.outputs.AWS_ENDPOINT_URL_S3 }}
          NIX_CACHE_SIGNING_KEY: ${{ steps.vault.outputs.NIX_CACHE_SIGNING_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          image_path=$(readlink -f result-ci)
          test -f "$image_path/nylon-ci-win2025.qcow2.zst"
          if [[ -n "$(nix-store --query --references "$image_path")" ]]; then
            echo '::error::The image package must have no runtime store dependencies.'
            exit 1
          fi

          umask 077
          signing_key=$(mktemp "$RUNNER_TEMP/nix-cache-key.XXXXXX")
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$signing_key"
          unset NIX_CACHE_SIGNING_KEY

          endpoint="${AWS_ENDPOINT_URL_S3#https://}"
          endpoint="${endpoint%/}"
          # The image is already compressed. Enable multipart for NARs over 5 GiB.
          nix copy --no-recursive "$image_path" --to \
            "s3://nylon-ci-windows-image?scheme=https&endpoint=$endpoint&region=auto&compression=none&multipart-upload=true&multipart-chunk-size=67108864&secret-key=$signing_key"
